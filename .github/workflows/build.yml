name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ostrzeżenia traktujemy jak błędy - w tym projekcie build jest czysty
      - name: dotnet build
        run: dotnet build ClaudeStatusOverlay.slnx -c Release --nologo -warnaserror
